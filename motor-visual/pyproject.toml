[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frontier-visual"
version = "0.1.0"
description = "Agente visual generalista: opera aplicaciones sin API mediante VNC y un modelo con visión"
requires-python = ">=3.11"
dependencies = [
  "pillow>=11.0",
  "websockets>=13.0",
  "pycryptodome>=3.21",
  "httpx>=0.27",
  "pydantic>=2.9",
  "pytesseract>=0.3.13",
]

[tool.setuptools]
packages = ["visual", "agente"]
